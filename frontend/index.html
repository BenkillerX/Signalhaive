<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO -->
    <title>SignalHaive — Forex Signals & Market Analysis</title>

    <meta
      name="description"
      content="SignalHaive provides real-time forex signals, live market data, trading analysis and market insights for forex traders."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://signalhaive.com/"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/icons/icon.png"
      type="image/png"
    />

    <link
      rel="shortcut icon"
      href="/icons/icon.png"
      type="image/png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- Mobile PWA -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- iOS PWA -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="SignalHaive"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://signalhaive.com/"
    />

    <meta
      property="og:title"
      content="SignalHaive — Forex Signals & Market Analysis"
    />

    <meta
      property="og:description"
      content="Real-time forex signals, live market data and trading analysis in one platform."
    />

    <meta
      property="og:image"
      content="https://signalhaive.com/icons/icon.png"
    />

    <meta
      property="og:site_name"
      content="SignalHaive"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SignalHaive — Forex Signals & Market Analysis"
    />

    <meta
      name="twitter:description"
      content="Real-time forex signals, live market data and trading analysis in one platform."
    />

    <meta
      name="twitter:image"
      content="https://signalhaive.com/icons/icon.png"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SignalHaive",
        "url": "https://signalhaive.com/",
        "logo": "https://signalhaive.com/icons/icon.png",
        "description": "SignalHaive provides real-time forex signals, live market data, trading analysis and market insights for forex traders."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
